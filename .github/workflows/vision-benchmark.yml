name: Private vision benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run or explicitly authorized three-request private smoke
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - smoke
      confirmation:
        description: Live only - AUTHORIZE_SMOKE_0_75_USD
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: private-vision-benchmark
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.repository == 'gempredict/gempredict-live' && github.ref == 'refs/heads/restore/phase1-identity-market-matching'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm ci --prefix benchmarks/ci-tools --ignore-scripts
      - name: Offline benchmark security tests
        run: node --test tests/vision-benchmark.test.mjs tests/vision-actions.test.mjs tests/vision-secrets-smoke.test.mjs
      - name: CardSight credential-free validation
        run: |
          node --test tests/cardsight-access.test.mjs
          node scripts/cardsight/access.mjs discovery-dry-run
      - name: Credential-free dry-run
        run: node scripts/vision-benchmark/actions.mjs dry-run

  live:
    needs: dry-run
    if: >-
      inputs.mode == 'smoke' &&
      github.repository == 'gempredict/gempredict-live' &&
      github.ref == 'refs/heads/restore/phase1-identity-market-matching' &&
      github.run_attempt == 1 &&
      vars.VISION_BENCH_LIVE_ENABLED == 'true' &&
      github.actor_id == vars.VISION_BENCH_OWNER_ID
    environment: vision-benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BENCH_MODE: ${{ inputs.mode }}
      BENCH_CONFIRMATION: ${{ inputs.confirmation }}
      BENCH_OWNER_ID: ${{ vars.VISION_BENCH_OWNER_ID }}
      BENCH_LIVE_ENABLED: ${{ vars.VISION_BENCH_LIVE_ENABLED }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install locked isolated tooling and build without provider credentials
        run: |
          npm ci --ignore-scripts
          npm ci --prefix benchmarks/ci-tools --ignore-scripts
          npm run build
          echo "NODE_PATH=$GITHUB_WORKSPACE/benchmarks/ci-tools/node_modules" >> "$GITHUB_ENV"
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo 'A supported local browser is required.' >&2
            exit 1
          fi
      - name: Validate approval before retrieving any private data
        run: node --input-type=module -e "import {liveContext} from './scripts/vision-benchmark/actions.mjs'; liveContext();"
      - name: Decrypt private front and back on the runner
        env:
          VISION_BENCH_DATA_KEY: ${{ secrets.VISION_BENCH_DATA_KEY }}
        run: node scripts/vision-benchmark/secrets-smoke.mjs receive
      - name: Run the existing bounded benchmark
        env:
          VISION_BENCH_ANTHROPIC_KEY: ${{ secrets.VISION_BENCH_ANTHROPIC_KEY || secrets.CLAUDE_API_KEY }}
          VISION_BENCH_OPENAI_KEY: ${{ secrets.VISION_BENCH_OPENAI_KEY }}
          VISION_BENCH_GEMINI_KEY: ${{ secrets.VISION_BENCH_GEMINI_KEY }}
        run: node scripts/vision-benchmark/secrets-smoke.mjs run
      - name: Encrypt private assessments
        if: always()
        env:
          VISION_BENCH_DATA_KEY: ${{ secrets.VISION_BENCH_DATA_KEY }}
        run: node scripts/vision-benchmark/secrets-smoke.mjs encrypt
      - name: Upload only encrypted assessments
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-vision-smoke
          path: ${{ runner.temp }}/gp-encrypted-smoke/assessments.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove all private runner files
        if: always()
        run: node scripts/vision-benchmark/secrets-smoke.mjs cleanup

  the-card-api-coverage:
    name: The Card API three-card coverage (maximum three GETs, 75 rows)
    needs: dry-run
    if: >-
      inputs.mode == 'dry-run' &&
      inputs.confirmation == 'AUTHORIZE_THE_CARD_API_THREE_SEARCHES_75_ROWS' &&
      github.repository == 'gempredict/gempredict-live' &&
      github.ref == 'refs/heads/restore/phase1-identity-market-matching' &&
      github.run_attempt == 1 &&
      github.actor_id == vars.VISION_BENCH_OWNER_ID
    environment: vision-benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Credential-free coverage tests and plan
        run: |
          node --test tests/the-card-api-coverage.test.mjs
          node scripts/the-card-api/coverage.mjs dry-run
      - name: Run owner-authorized three-search coverage benchmark
        env:
          CARD_MODE: ${{ inputs.mode }}
          CARD_APPROVAL: ${{ inputs.confirmation }}
          CARD_OWNER_ID: ${{ vars.VISION_BENCH_OWNER_ID }}
          THE_CARD_API_KEY: ${{ secrets.THE_CARD_API_KEY }}
        run: node scripts/the-card-api/coverage.mjs live

  the-card-api-sales:
    name: The Card API sales verification (maximum two GETs, 50 rows)
    needs: dry-run
    if: >-
      inputs.mode == 'dry-run' &&
      (inputs.confirmation == 'AUTHORIZE_THE_CARD_API_MAX_2_GETS_50_ROWS' || inputs.confirmation == 'AUTHORIZE_THE_CARD_API_ONE_GET_REDIRECT_HEADERS_ONLY' || inputs.confirmation == 'AUTHORIZE_THE_CARD_API_ONE_GET_SCHEMA_ONLY' || inputs.confirmation == 'AUTHORIZE_THE_CARD_API_ONE_GET_BROAD_SCHEMA_ONLY') &&
      github.repository == 'gempredict/gempredict-live' &&
      github.ref == 'refs/heads/restore/phase1-identity-market-matching' &&
      github.run_attempt == 1 &&
      github.actor_id == vars.VISION_BENCH_OWNER_ID
    environment: vision-benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: The Card API offline boundary tests
        run: |
          node --test tests/the-card-api.test.mjs
          node scripts/the-card-api/verify.mjs dry-run
      - name: Run owner-authorized read-only sales diagnostic
        env:
          CARD_MODE: ${{ inputs.mode }}
          CARD_APPROVAL: ${{ inputs.confirmation }}
          CARD_OWNER_ID: ${{ vars.VISION_BENCH_OWNER_ID }}
          THE_CARD_API_KEY: ${{ secrets.THE_CARD_API_KEY }}
        run: |
          if [ "$CARD_APPROVAL" = 'AUTHORIZE_THE_CARD_API_ONE_GET_REDIRECT_HEADERS_ONLY' ]; then
            node scripts/the-card-api/verify.mjs inspect-redirect
          elif [ "$CARD_APPROVAL" = 'AUTHORIZE_THE_CARD_API_ONE_GET_SCHEMA_ONLY' ]; then
            node scripts/the-card-api/verify.mjs inspect-schema
          elif [ "$CARD_APPROVAL" = 'AUTHORIZE_THE_CARD_API_ONE_GET_BROAD_SCHEMA_ONLY' ]; then
            node scripts/the-card-api/verify.mjs inspect-broad-schema
          else
            node scripts/the-card-api/verify.mjs live
          fi

  cardsight-access:
    name: CardSight final catalog discovery (maximum one request)
    needs: dry-run
    if: >-
      inputs.mode == 'dry-run' &&
      inputs.confirmation == 'AUTHORIZE_CARDSIGHT_ONE_CATALOG_REQUEST' &&
      github.repository == 'gempredict/gempredict-live' &&
      github.ref == 'refs/heads/restore/phase1-identity-market-matching' &&
      github.run_attempt == 1 &&
      github.actor_id == vars.VISION_BENCH_OWNER_ID
    environment: vision-benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: CardSight offline boundary tests
        run: node --test tests/cardsight-access.test.mjs
      - name: Run explicitly approved CardSight audit, no retries or paid AI
        env:
          CARDSIGHT_MODE: ${{ inputs.mode }}
          CARDSIGHT_APPROVAL: ${{ inputs.confirmation }}
          CARDSIGHT_OWNER_ID: ${{ vars.VISION_BENCH_OWNER_ID }}
          CARDSIGHT_API_KEY: ${{ secrets.CARDSIGHT_API_KEY }}
        run: node scripts/cardsight/access.mjs live

